name: Optimize Portfolio Images

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Compress portfolio strips
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          for path in Path('public/images').glob('portfolio-column-*.jpg'):
              with Image.open(path) as image:
                  if image.width <= 256:
                      continue
                  ratio = 256 / image.width
                  size = (256, max(1, round(image.height * ratio)))
                  optimized = image.convert('RGB').resize(size, Image.Resampling.LANCZOS)
                  optimized.save(path, 'JPEG', quality=72, optimize=True, progressive=True)
                  print(f'{path}: {image.size} -> {size}')
          PY

      - name: Commit optimized images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/images/portfolio-column-*.jpg
          if git diff --cached --quiet; then
            echo 'No image changes needed.'
            exit 0
          fi
          git commit -m 'perf: compress portfolio images [skip ci]'
          git push